# Render builds this repository's Dockerfile after GitHub Actions checks pass.
services:
  - type: web
    name: asr-adperf-mlflow
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-mlflow.sh
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: HEALTH_PATH
        value: /health
      # This deployment only tracks experiments; it does not run server-side
      # scorer jobs. Disabling the job executor avoids allocating a second
      # worker/queue on Render's 512 MiB free instance.
      - key: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
        value: "false"

  - type: web
    name: asr-adperf-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-api.sh
    healthCheckPath: /ready
    autoDeployTrigger: checksPass

  - type: web
    name: asr-adperf-dashboard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start-dashboard.sh
    healthCheckPath: /_stcore/health
    autoDeployTrigger: checksPass
    envVars:
      - key: MLFLOW_TRACKING_URI
        value: https://asr-adperf-mlflow.onrender.com
      - key: HEALTH_PATH
        value: /_stcore/health
