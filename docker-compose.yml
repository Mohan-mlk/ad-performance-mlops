services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MLFLOW_TRACKING_URI: sqlite:////app/mlflow.db
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run src/adperf/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
    depends_on: [api]
    restart: unless-stopped

  mlflow:
    build: .
    command: mlflow ui --backend-store-uri sqlite:////app/mlflow.db --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
    volumes:
      - ./mlflow.db:/app/mlflow.db
